<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ministerstvo informací - telefonní strom</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #eee8d9;
      --muted: #afa696;
      --dim: rgba(238, 232, 217, 0.42);
      --line: rgba(238, 232, 217, 0.18);
      --panel: #171819;
      --deep: #0b0d0e;
      --screen: #172217;
      --screen-text: #dcebd2;
      --accent: #d2b36b;
      --red: #9e3d36;
      --blue: #55758e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.32), transparent 25%, transparent 75%, rgba(0, 0, 0, 0.26)),
        radial-gradient(circle at 25% 16%, rgba(210, 179, 107, 0.13), transparent 22rem),
        linear-gradient(135deg, #151718 0%, #0b0d0e 55%, #1a1511 100%);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    main {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(19rem, 29rem) minmax(18rem, 1fr);
      gap: clamp(1rem, 4vw, 3rem);
      padding: clamp(1rem, 3vw, 2.5rem);
      align-items: center;
    }

    .phone {
      width: min(100%, 28rem);
      margin: 0 auto;
      padding: 1.15rem;
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      background: linear-gradient(180deg, #2b2b2a, #121313 68%);
      box-shadow: 0 2rem 4rem rgba(0, 0, 0, 0.36);
    }

    .receiver {
      display: grid;
      place-items: center;
      height: 2.1rem;
      margin-bottom: 1rem;
    }

    .speaker {
      width: 8.6rem;
      height: 0.62rem;
      border-radius: 999px;
      background: #050606;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .screen {
      min-height: 12.5rem;
      padding: 1rem;
      border: 1px solid rgba(123, 149, 112, 0.48);
      border-radius: 0.35rem;
      background: var(--screen);
      color: var(--screen-text);
      box-shadow: inset 0 0 1.8rem rgba(0, 0, 0, 0.44);
    }

    .kicker {
      margin: 0 0 0.6rem;
      color: #9eb58d;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.9rem, 5vw, 3.7rem);
      line-height: 0.98;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 0.75rem;
      font-size: 1.05rem;
      line-height: 1.2;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      line-height: 1.54;
    }

    .meta {
      margin-top: 0.75rem;
      color: #9eb58d;
      font-size: 0.8rem;
      word-break: break-word;
    }

    audio {
      width: 100%;
      height: 2.35rem;
      margin-top: 0.85rem;
      filter: sepia(0.28) saturate(0.8);
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.64rem;
      margin-top: 0.9rem;
    }

    button {
      appearance: none;
      height: 4.35rem;
      min-width: 0;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 0.42rem;
      background: linear-gradient(180deg, #333331, #171717);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.11), 0 0.45rem 0.85rem rgba(0, 0, 0, 0.24);
    }

    button:hover, button:focus-visible {
      border-color: var(--accent);
      outline: none;
    }

    .global {
      border-color: rgba(210, 179, 107, 0.32);
    }

    .inactive {
      color: var(--dim);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .digit {
      display: block;
      font-size: 1.42rem;
      line-height: 1;
      font-weight: 750;
    }

    .label {
      display: block;
      margin-top: 0.35rem;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.12;
      overflow-wrap: anywhere;
    }

    .content {
      display: grid;
      align-content: center;
      gap: 1.4rem;
      max-width: 56rem;
    }

    .title-band {
      padding-bottom: 1.15rem;
      border-bottom: 1px solid var(--line);
    }

    .path {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      min-height: 1.7rem;
    }

    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.25rem 0.6rem;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .panel {
      display: grid;
      gap: 1rem;
      max-width: 46rem;
    }

    .fixed-keys {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.55rem;
      border-top: 1px solid var(--line);
      padding-top: 1rem;
    }

    .fixed-key {
      min-height: 4.1rem;
      padding: 0.7rem;
      border: 1px solid var(--line);
      border-radius: 0.45rem;
      background: rgba(255, 255, 255, 0.035);
    }

    .fixed-key strong {
      display: block;
      color: var(--accent);
      margin-bottom: 0.3rem;
    }

    .fixed-key span {
      display: block;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.2;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.65rem;
    }

    .choice {
      border-left: 2px solid var(--accent);
      padding-left: 0.7rem;
      color: var(--muted);
      min-height: 2.4rem;
      line-height: 1.35;
    }

    .choice strong {
      color: var(--ink);
      margin-right: 0.25rem;
    }

    @media (max-width: 860px) {
      main {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .content {
        align-content: start;
      }
    }

    @media (max-width: 540px) {
      .fixed-keys,
      .choices {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      button {
        height: 4rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="phone" aria-label="Telefonní ovládání">
      <div class="receiver"><div class="speaker"></div></div>
      <div class="screen">
        <p class="kicker">Pevná linka</p>
        <h2 id="nodeTitle">Načítám...</h2>
        <p id="nodeText"></p>
        <p class="meta" id="nodeFile"></p>
      </div>
      <audio id="player" controls preload="auto"></audio>
      <div class="keypad" id="keypad"></div>
    </section>

    <section class="content" aria-live="polite">
      <div class="title-band">
        <p class="kicker">Ministerstvo informací</p>
        <h1>Telefonní strom</h1>
      </div>
      <div class="panel">
        <div class="path" id="path"></div>
        <p id="fullText"></p>
        <div class="choices" id="choices"></div>
        <div class="fixed-keys" id="fixedKeys"></div>
      </div>
    </section>
  </main>

  <script>
    const keyOrder = ["1", "2", "3", "A", "4", "5", "B", "C"];
    const history = [];
    let data;
    let current;

    const titleEl = document.getElementById("nodeTitle");
    const textEl = document.getElementById("nodeText");
    const fileEl = document.getElementById("nodeFile");
    const fullTextEl = document.getElementById("fullText");
    const pathEl = document.getElementById("path");
    const keypadEl = document.getElementById("keypad");
    const choicesEl = document.getElementById("choices");
    const fixedKeysEl = document.getElementById("fixedKeys");
    const player = document.getElementById("player");

    function node() {
      return data.nodes[current];
    }

    function playCurrent() {
      player.currentTime = 0;
      player.play().catch(() => {});
    }

    function goHome() {
      history.length = 0;
      loadNode(data.start);
    }

    function press(key) {
      if (key === "1") {
        playCurrent();
        return;
      }
      if (key === "5") {
        goHome();
        return;
      }
      const target = node().options?.[key]?.target;
      if (!target) return;
      history.push(target);
      loadNode(target);
    }

    function renderKeypad() {
      keypadEl.innerHTML = "";
      keyOrder.forEach(key => {
        const option = node().options?.[key];
        const isGlobal = key === "1" || key === "5";
        const button = document.createElement("button");
        button.type = "button";
        button.className = `${isGlobal ? "global" : ""} ${!isGlobal && !option ? "inactive" : ""}`;
        button.dataset.key = key;
        button.innerHTML = `<span class="digit">${key}</span><span class="label">${data.keyLabels[key]}</span>`;
        button.addEventListener("click", () => press(key));
        keypadEl.appendChild(button);
      });
    }

    function renderChoices() {
      choicesEl.innerHTML = "";
      Object.entries(node().options || {}).forEach(([key, option]) => {
        const item = document.createElement("div");
        item.className = "choice";
        item.innerHTML = `<strong>${key}</strong>${option.label}`;
        choicesEl.appendChild(item);
      });
    }

    function renderFixedKeys() {
      fixedKeysEl.innerHTML = "";
      keyOrder.forEach(key => {
        const item = document.createElement("div");
        item.className = "fixed-key";
        item.innerHTML = `<strong>${key}</strong><span>${data.keyLabels[key]}</span>`;
        fixedKeysEl.appendChild(item);
      });
    }

    function renderPath() {
      pathEl.innerHTML = "";
      [data.start, ...history].forEach(id => {
        const pill = document.createElement("span");
        pill.className = "pill";
        pill.textContent = data.nodes[id].title;
        pathEl.appendChild(pill);
      });
    }

    function loadNode(id, shouldPlay = true) {
      current = id;
      titleEl.textContent = node().title;
      textEl.textContent = node().text;
      fullTextEl.textContent = node().text;
      fileEl.textContent = `Soubor: ${node().file}`;
      player.src = `${data.audioBase}${node().file}`;
      renderKeypad();
      renderChoices();
      renderFixedKeys();
      renderPath();
      if (shouldPlay) playCurrent();
    }

    window.addEventListener("keydown", event => {
      const key = event.key.toUpperCase();
      if (keyOrder.includes(key)) press(key);
      if (key === "ESCAPE") goHome();
      if (key === " " || key === "ENTER") {
        event.preventDefault();
        player.paused ? player.play().catch(() => {}) : player.pause();
      }
    });

    fetch("tree-data.json")
      .then(response => response.json())
      .then(json => {
        data = json;
        loadNode(data.start, false);
      })
      .catch(() => {
        titleEl.textContent = "Chyba spojení";
        textEl.textContent = "Telefonní strom se nepodařilo načíst.";
      });
  </script>
</body>
</html>
