<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ministerstvo informací - telefonní strom</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f0e4c7;
      --paper: #d8c59a;
      --muted: #9d8d6e;
      --dim: rgba(240, 228, 199, 0.35);
      --line: rgba(240, 228, 199, 0.24);
      --bakelite: #15120e;
      --bakelite-2: #2b251d;
      --screen: #182513;
      --screen-text: #cfe7b8;
      --accent: #c49a49;
      --red: #8d2d24;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.018) 0 1px, transparent 1px 4px),
        radial-gradient(circle at 50% 0%, rgba(196, 154, 73, 0.14), transparent 18rem),
        linear-gradient(135deg, #201a13 0%, #080807 58%, #1a1510 100%);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    main {
      height: 100vh;
      height: 100dvh;
      display: grid;
      padding: clamp(0.45rem, 2.2vw, 1rem);
      align-items: center;
      justify-items: center;
    }

    .phone {
      width: min(100%, 23.5rem);
      max-height: calc(100dvh - 0.9rem);
      margin: 0 auto;
      padding: clamp(0.6rem, 2.3vh, 0.95rem);
      border: 1px solid rgba(255, 238, 191, 0.18);
      border-radius: 0.42rem;
      background:
        radial-gradient(circle at 28% 10%, rgba(255, 245, 210, 0.09), transparent 8rem),
        linear-gradient(145deg, var(--bakelite-2), var(--bakelite) 62%, #080706);
      box-shadow:
        inset 0 1px rgba(255, 255, 255, 0.08),
        inset 0 -1.1rem 2.5rem rgba(0, 0, 0, 0.28),
        0 1.2rem 3rem rgba(0, 0, 0, 0.52);
      display: grid;
      grid-template-rows: auto auto auto auto 1fr auto;
      gap: clamp(0.42rem, 1.4vh, 0.7rem);
    }

    .receiver {
      display: grid;
      place-items: center;
      height: clamp(1.15rem, 3.6vh, 1.8rem);
    }

    .speaker {
      width: 8rem;
      height: 0.48rem;
      border-radius: 999px;
      background: #050606;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 1px rgba(196, 154, 73, 0.18);
    }

    .plaque {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      color: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-block: 1px solid rgba(216, 197, 154, 0.24);
      padding: 0.34rem 0.1rem 0.32rem;
    }

    .plaque span:last-child {
      color: var(--muted);
      font-size: 0.66rem;
    }

    .screen {
      min-height: 7.2rem;
      padding: 0.72rem;
      border: 1px solid rgba(123, 149, 112, 0.48);
      border-radius: 0.22rem;
      background:
        repeating-linear-gradient(0deg, rgba(207, 231, 184, 0.045) 0 1px, transparent 1px 3px),
        var(--screen);
      color: var(--screen-text);
      box-shadow: inset 0 0 1.8rem rgba(0, 0, 0, 0.58);
      overflow: hidden;
    }

    .kicker {
      margin: 0 0 0.42rem;
      color: #91ad7f;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    h2 {
      margin: 0 0 0.45rem;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.05rem, 5vw, 1.42rem);
      line-height: 1.2;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      line-height: 1.35;
    }

    #nodeText {
      color: rgba(207, 231, 184, 0.84);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: 0.86rem;
    }

    audio {
      display: none;
    }

    .transport {
      display: grid;
      grid-template-columns: 3.2rem 1fr auto;
      align-items: center;
      gap: 0.7rem;
      min-height: 2.15rem;
      border: 1px solid rgba(216, 197, 154, 0.18);
      border-radius: 999px;
      padding: 0.24rem 0.58rem 0.24rem 0.24rem;
      background: rgba(0, 0, 0, 0.27);
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 0.8rem;
    }

    .play-toggle {
      height: 1.62rem;
      min-width: 0;
      border-radius: 999px;
      padding: 0;
      color: #15120e;
      background: linear-gradient(180deg, #ead9ad, #a87b2e);
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.38), 0 0.2rem 0.35rem rgba(0, 0, 0, 0.26);
      font-size: 0.82rem;
      font-weight: 800;
    }

    .progress {
      height: 0.3rem;
      border-radius: 999px;
      background: rgba(216, 197, 154, 0.2);
      overflow: hidden;
    }

    .progress span {
      display: block;
      width: calc(var(--progress, 0) * 100%);
      height: 100%;
      background: var(--accent);
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.34rem;
      min-height: 4.68rem;
    }

    .choice {
      min-height: 1.85rem;
      display: flex;
      align-items: center;
      gap: 0.42rem;
      border: 1px solid rgba(216, 197, 154, 0.21);
      border-radius: 0.18rem;
      padding: 0.28rem 0.42rem;
      background: rgba(0, 0, 0, 0.16);
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.05;
      overflow: hidden;
    }

    .choice strong {
      flex: 0 0 auto;
      color: var(--accent);
      font-size: 0.9rem;
      line-height: 1;
    }

    .choice span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .keypad {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: repeat(5, minmax(2.75rem, 1fr));
      gap: clamp(0.34rem, 1.05vh, 0.48rem);
      min-height: 17rem;
    }

    button {
      appearance: none;
      height: 100%;
      min-width: 0;
      border: 1px solid rgba(239, 220, 176, 0.18);
      border-radius: 0.24rem;
      background:
        radial-gradient(circle at 34% 20%, rgba(255, 255, 255, 0.11), transparent 2rem),
        linear-gradient(180deg, #3a3228, #15120f);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.12), 0 0.32rem 0.56rem rgba(0, 0, 0, 0.28);
    }

    button:hover, button:focus-visible {
      border-color: var(--accent);
      outline: none;
    }

    .global {
      border-color: rgba(196, 154, 73, 0.42);
      background:
        radial-gradient(circle at 34% 20%, rgba(255, 241, 193, 0.14), transparent 2rem),
        linear-gradient(180deg, #42331d, #17120c);
    }

    .inactive {
      color: var(--dim);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .digit {
      display: block;
      font-size: clamp(1.2rem, 4.6vh, 1.55rem);
      line-height: 1;
      font-weight: 750;
    }

    .label {
      display: none;
    }

    .icon {
      display: none;
      margin-top: 0.18rem;
      color: var(--accent);
      font-size: 0.88rem;
      line-height: 1;
    }

    .special .icon {
      display: block;
    }

    .fixed-keys {
      display: flex;
      justify-content: space-between;
      gap: 0.4rem;
      min-height: 1rem;
      color: var(--muted);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .fixed-key {
      white-space: nowrap;
    }

    .fixed-key strong {
      color: var(--accent);
      margin-right: 0.2rem;
    }

    .fixed-key span {
      color: inherit;
    }

    @media (max-height: 690px) {
      main {
        padding: 0.32rem;
      }

      .phone {
        padding: 0.48rem;
        gap: 0.34rem;
      }

      .receiver {
        display: none;
      }

      .plaque {
        font-size: 0.66rem;
        padding-block: 0.24rem;
      }

      .screen {
        min-height: 5.05rem;
        padding: 0.52rem;
      }

      .kicker {
        margin-bottom: 0.22rem;
        font-size: 0.54rem;
      }

      h2 {
        margin-bottom: 0.28rem;
        font-size: 1.05rem;
      }

      #nodeText {
        -webkit-line-clamp: 1;
        font-size: 0.72rem;
      }

      .choices {
        gap: 0.22rem;
      }

      .choice {
        min-height: 1.32rem;
        padding: 0.18rem 0.34rem;
        font-size: 0.68rem;
      }

      .transport {
        min-height: 1.78rem;
        grid-template-columns: 2.7rem 1fr auto;
        gap: 0.48rem;
        font-size: 0.68rem;
      }

      .play-toggle {
        height: 1.34rem;
        font-size: 0.68rem;
      }

      .keypad {
        min-height: 13.9rem;
      }

      .digit {
        font-size: 1.32rem;
      }

      .fixed-keys {
        font-size: 0.55rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="phone" aria-label="Telefonní ovládání">
      <div class="receiver"><div class="speaker"></div></div>
      <div class="plaque"><span>Ministerstvo informací</span><span>1949</span></div>
      <div class="screen">
        <p class="kicker">Pevná linka</p>
        <h2 id="nodeTitle">Načítám...</h2>
        <p id="nodeText"></p>
      </div>
      <div class="choices" id="choices"></div>
      <div class="transport">
        <button class="play-toggle" id="playToggle" type="button" aria-label="Přehrát nebo pozastavit">PLAY</button>
        <div class="progress" aria-hidden="true"><span id="progressFill"></span></div>
        <span id="timeReadout">0:00</span>
      </div>
      <audio id="player" preload="auto"></audio>
      <div class="keypad" id="keypad"></div>
      <div class="fixed-keys" id="fixedKeys"></div>
    </section>
  </main>

  <script>
    const keyOrder = ["1", "2", "3", "4", "5", "A", "B", "C"];
    const assetVersion = "mobile-vintage-v1";
    const keyPositions = {
      "1": [1, 1],
      "2": [2, 1],
      "3": [3, 1],
      "4": [4, 1],
      "5": [5, 1],
      "A": [1, 2],
      "B": [2, 2],
      "C": [3, 2]
    };
    const history = [];
    let data;
    let current;

    const titleEl = document.getElementById("nodeTitle");
    const textEl = document.getElementById("nodeText");
    const keypadEl = document.getElementById("keypad");
    const choicesEl = document.getElementById("choices");
    const fixedKeysEl = document.getElementById("fixedKeys");
    const player = document.getElementById("player");
    const playToggle = document.getElementById("playToggle");
    const progressFill = document.getElementById("progressFill");
    const timeReadout = document.getElementById("timeReadout");

    function node() {
      return data.nodes[current];
    }

    function playCurrent() {
      player.currentTime = 0;
      player.play().catch(() => {});
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";
      const minutes = Math.floor(seconds / 60);
      const rest = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${minutes}:${rest}`;
    }

    function updateTransport() {
      const progress = player.duration ? player.currentTime / player.duration : 0;
      progressFill.style.setProperty("--progress", Math.min(1, Math.max(0, progress)));
      timeReadout.textContent = player.duration ? `${formatTime(player.currentTime)} / ${formatTime(player.duration)}` : "0:00";
      playToggle.textContent = player.paused ? "PLAY" : "STOP";
    }

    function goHome() {
      history.length = 0;
      loadNode(data.start);
    }

    function press(key) {
      if (key === "1") {
        const target = node().options?.[key]?.target;
        if (target) {
          history.push(target);
          loadNode(target);
        }
        return;
      }
      if (key === "A") {
        goHome();
        return;
      }
      if (key === "B") {
        history.push("english");
        loadNode("english");
        return;
      }
      if (key === "C") {
        playCurrent();
        return;
      }
      const target = node().options?.[key]?.target;
      if (!target) return;
      history.push(target);
      loadNode(target);
    }

    function renderKeypad() {
      keypadEl.innerHTML = "";
      keyOrder.forEach(key => {
        const option = node().options?.[key];
        const isGlobal = key === "A" || key === "B" || key === "C";
        const button = document.createElement("button");
        const icon = data.keyIcons?.[key] || "";
        button.type = "button";
        button.className = `${isGlobal ? "global special" : ""} ${!isGlobal && !option ? "inactive" : ""}`;
        button.dataset.key = key;
        button.style.gridRow = keyPositions[key][0];
        button.style.gridColumn = keyPositions[key][1];
        button.innerHTML = `<span class="digit">${key}</span><span class="icon">${icon}</span><span class="label">${data.keyLabels[key]}</span>`;
        button.addEventListener("click", () => press(key));
        keypadEl.appendChild(button);
      });
    }

    function renderChoices() {
      choicesEl.innerHTML = "";
      Object.entries(node().options || {}).forEach(([key, option]) => {
        const item = document.createElement("div");
        item.className = "choice";
        item.innerHTML = `<strong>${key}</strong><span>${option.label}</span>`;
        choicesEl.appendChild(item);
      });
    }

    function renderFixedKeys() {
      fixedKeysEl.innerHTML = "";
      ["A", "B", "C"].forEach(key => {
        const item = document.createElement("div");
        item.className = "fixed-key";
        item.innerHTML = `<strong>${key}</strong><span>${data.keyLabels[key]}</span>`;
        fixedKeysEl.appendChild(item);
      });
    }

    function compactPrompt(text) {
      const firstSentence = text.match(/^[^.!?]+[.!?]/)?.[0] || text;
      return firstSentence.length > 82 ? `${firstSentence.slice(0, 79)}...` : firstSentence;
    }

    function loadNode(id, shouldPlay = true) {
      current = id;
      titleEl.textContent = node().title;
      textEl.textContent = compactPrompt(node().text);
      player.src = `${data.audioBase}${node().file}?v=${assetVersion}`;
      renderKeypad();
      renderChoices();
      renderFixedKeys();
      updateTransport();
      if (shouldPlay) playCurrent();
    }

    window.addEventListener("keydown", event => {
      const key = event.key.toUpperCase();
      if (keyOrder.includes(key)) press(key);
      if (key === "ESCAPE") goHome();
      if (key === " " || key === "ENTER") {
        event.preventDefault();
        player.paused ? player.play().catch(() => {}) : player.pause();
      }
    });

    playToggle.addEventListener("click", () => {
      player.paused ? player.play().catch(() => {}) : player.pause();
    });

    player.addEventListener("play", updateTransport);
    player.addEventListener("pause", updateTransport);
    player.addEventListener("timeupdate", updateTransport);
    player.addEventListener("loadedmetadata", updateTransport);
    player.addEventListener("ended", updateTransport);

    fetch(`tree-data.json?v=${assetVersion}`)
      .then(response => response.json())
      .then(json => {
        data = json;
        loadNode(data.start, false);
      })
      .catch(() => {
        titleEl.textContent = "Chyba spojení";
        textEl.textContent = "Telefonní strom se nepodařilo načíst.";
      });
  </script>
</body>
</html>
